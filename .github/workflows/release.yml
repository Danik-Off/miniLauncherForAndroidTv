name: Release

# Push a tag like v1.2.0 and this builds a signed APK and publishes a GitHub Release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the changelog

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # monotonically increasing versionCode: number of commits reachable from the tag
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          mv app/build/outputs/apk/release/app-release.apk \
             "MiniLauncher-${{ steps.version.outputs.name }}.apk"

      - name: Changelog since previous tag
        id: changelog
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          {
            echo "## Изменения"
            git log --pretty='- %s' "$range"
            echo
            echo "**Установка:** \`adb install -r MiniLauncher-${{ steps.version.outputs.name }}.apk\`"
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo
              echo "_APK подписан debug-ключом (секрет KEYSTORE_BASE64 не задан)._"
            fi
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Mini Launcher ${{ steps.version.outputs.name }}
          body_path: notes.md
          files: MiniLauncher-${{ steps.version.outputs.name }}.apk
